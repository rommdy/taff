# docker-compose.yml - Configuration Docker pour LocProd
version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: locprod-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: locprod
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - locprod-network

  # Backend API
  backend:
    build: .
    container_name: locprod-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/locprod?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      TWITTER_CONSUMER_KEY: ${TWITTER_CONSUMER_KEY}
      TWITTER_CONSUMER_SECRET: ${TWITTER_CONSUMER_SECRET}
      BASE_URL: http://localhost:5000
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - mongodb
    volumes:
      - ./logs:/usr/src/app/logs
    networks:
      - locprod-network

volumes:
  mongodb_data:
    driver: local

networks:
  locprod-network:
    driver: bridge
